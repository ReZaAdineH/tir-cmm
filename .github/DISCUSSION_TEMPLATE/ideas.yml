title: "[Idea] "
body:
  - type: markdown
    attributes:
      value: |
        Use Ideas for early-stage proposals that are not yet ready to become a model-change Issue. Start with the operational response problem, not the feature.
  - type: textarea
    id: problem
    attributes:
      label: Operational problem
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed idea or experiment
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence, experience and trade-offs
